<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #e0f7fa; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <!-- Profile Card -->
  <div 
    id="profileCard"
    style="
      width: 300px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 20px;
      text-align: center;
    "
  >
    <img 
      src="https://wallpapers.com/images/hd/cool-profile-pictures-panda-man-gsl2ntkjj3hrk84s.jpg"
      alt="Profile Picture"
      style="width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px;"
    >
    
    <h2 
      class="abc xyz"
      id="name"
      style="margin: 0; color: #00796b;"
    >
      John Doe
    </h2>
    
    <p 
      id="role"
      style="color: #555; font-size: 14px; margin: 5px 0 15px 0;"
    >
      Frontend Developer
    </p>
    
    <button 
      id="followBtn"
      style="
        padding: 10px 20px;
        background-color: #00796b;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      "
    >
      Follow
    </button>
  </div>
    <script src="./index.js"></script>
</body>
</html>
